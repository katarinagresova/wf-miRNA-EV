<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <defs>
    <!-- A small RNA: backbone with bases -->
    <g id="rna" fill="none" stroke="#f59e0b" stroke-linecap="round">
      <path d="M0 0 q7 -3 14 0" stroke-width="2.8"/>
      <path d="M2.5 -0.9 v3.6 M5.8 -1.4 v3.6 M9.1 -1.4 v3.6 M12.2 -0.7 v3.6" stroke-width="2"/>
    </g>
  </defs>
  <!-- Extracellular vesicle: the lumen and the two leaflets of the lipid bilayer (head groups as beads) -->
  <circle cx="32" cy="32" r="25" fill="#0d9488" fill-opacity="0.13"/>
  <circle cx="32" cy="32" r="24.7" fill="none" stroke="#0d9488" stroke-width="1.2" stroke-opacity="0.45"/>
  <circle cx="32" cy="32" r="28.6" fill="none" stroke="#0d9488" stroke-width="5.2" stroke-linecap="round" stroke-dasharray="0.01 6.4179"/>
  <circle cx="32" cy="32" r="20.8" fill="none" stroke="#0d9488" stroke-width="4.4" stroke-linecap="round" stroke-dasharray="0.01 5.9406"/>
  <!-- Small RNAs -->
  <use xlink:href="#rna" transform="translate(20 25) rotate(-12)"/>
  <use xlink:href="#rna" transform="translate(30 36) rotate(-35)"/>
  <use xlink:href="#rna" transform="translate(20.5 40.5) rotate(14)"/>
</svg>
