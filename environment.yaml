# Environment that runs Snakemake. Each rule gets its own conda env from workflow/envs/.
# Snakemake 9.23.1 is the first release that supports Python 3.14.
name: wf-miRNA-EV
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.14
  - snakemake-minimal=9.23.1
  - snakemake-executor-plugin-slurm=2.7.1
  - pandas=2.3  # the Snakefile reads the sample sheet with pandas
