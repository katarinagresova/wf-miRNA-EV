# Example SLURM profile: one SLURM job per rule instance.
# Needs snakemake-executor-plugin-slurm (environment.yaml). Run: snakemake --profile profiles/slurm
executor: slurm
jobs: 50
use-conda: true
printshellcmds: true
rerun-incomplete: true
latency-wait: 60
default-resources:
  slurm_partition: normal  # set a partition of your cluster
  # slurm_account: my_account  # set if your cluster needs an account
  mem_mb: 4000
  runtime: 120
# Per-job SLURM logs, kept after success
slurm-logdir: logs/slurm
slurm-keep-successful-logs: true
